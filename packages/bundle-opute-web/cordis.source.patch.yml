# Source overlay for `node scripts/launch-opute-web.js`.
# Relative entries are anchored to this file so the profile does not need
# `@opute/*` on NODE_PATH (ESM ignores NODE_PATH).

# Opute identity is the complete system-prompt section. DSH defaults would
# inject harness identity, the checkout path, the Web GUI orientation, and a
# coding-agent persona — those stay off.
- id: system-prompt
  config:
    includeHarnessIdentity: false
    includeRuntimeContext: false
    persona: ''

# Restate every web-runtime key: a patch replaces the row's entire config.
# `surfaceContext: false` drops harness:source and app:web-surface.
- id: web-runtime
  inject: [webStartup]
  config:
    openBrowser: !!js ctx.webStartup.openBrowser
    # The process token is useful for local sessions, but must not enter
    # workload logs in a hosted deployment.
    printUrl: !!js process.env.OPUTE_HARNESS_PRINT_URL !== '0'
    surfaceContext: false
    trustedHosts: !!js ctx.webStartup.trustedHosts
    publicUrl: !!js process.env.OPUTE_HARNESS_PUBLIC_URL || undefined
    hostedPublicAccess: true

- id: agent-presets
  name: '@deepseek-ai/dsh-agent-presets'
  config:
    default: opute
    includeShippedRoot: false
    includeUserRoot: false
    roots:
      - path: !!js process.env.OPUTE_HARNESS_PRESET_ROOT
        trust: system

- id: directory-picker
  disabled: true

- id: ui-workspace
  disabled: true

- id: file-reference-local
  disabled: true

# File-reference renderer also registers ui:deliverable-file-references.
- id: ui-deliverables
  disabled: true

# Official whale / "DeepSeek Harness" wordmark. ui-opute fills the same
# slots with the Opute house mark at a lower priority as a second belt.
- id: ui-brand-official
  disabled: true

# The stock llm-deepseek adapter is not an Opute provider. Disabling it also
# completes first-run onboarding (adapter-absent) without the API-key modal.
- id: llm-deepseek
  disabled: true

# Stock default is deepseek-official (upstream adapter id). With that
# adapter gone, a leftover selection leaves the composer inert while the seat
# still shows the stale id.
- id: agent-default-model
  config:
    provider: openrouter
    model: ibm-granite/granite-4.2-8b

- id: plugin-package-inventory-deepseek
  disabled: true

# OpenRouter is the only Granite 4.2 acceptance route. Ollama remains available
# for unrelated local development models, but the e2e gate must never select a
# local Granite model.
- id: llm-pi-ai
  config:
    providers:
      openrouter:
        displayName: OpenRouter
        apiKeyEnv: OPENROUTER_API_KEY
        models:
          - id: ibm-granite/granite-4.2-8b
            name: Granite 4.2 8B
            contextWindow: 131072
            maxTokens: 4096
      ollama:
        displayName: Ollama
        api: openai-completions
        baseURL: !!js process.env.OLLAMA_BASE_URL || 'http://127.0.0.1:11434/v1'
        headers:
          Authorization: Bearer ollama
        models:
          - id: llama3.2
            name: Llama 3.2
            contextWindow: 131072
          - id: qwen2.5
            name: Qwen 2.5
            contextWindow: 131072
          - id: mistral
            name: Mistral
            contextWindow: 32768

- insert:
    - id: opute-workspace-seed
      name: '../plugin-workspace-seed/src/index.js'

    - id: opute-system-prompt
      name: '../plugin-system-prompt/src/index.js'

    - id: opute-tool-lockdown
      name: '../plugin-tool-lockdown/src/index.js'

    # Stock dsh-mcp-client sends initialize; Opute 2026-07-28 rejects it.
    - id: mcp-opute
      name: '../plugin-mcp-opute/src/index.js'

    - id: opute-tool-retrieval
      name: '../plugin-tool-retrieval/src/index.js'

    - id: ui-opute
      name: '../client-ui-opute/src/index.js'
