# The in-cluster public Harness deployment.  Granite 4.2 is requested from
# OpenRouter through the secret-backed API key; no local model proxy is part of
# this workload.  DSH remains pod-local; Cloudflare is the only public path.
apiVersion: v1
kind: Namespace
metadata:
  name: opute-harness
  labels:
    app.kubernetes.io/part-of: opute
    app.kubernetes.io/managed-by: opute-harness
---
apiVersion: v1
kind: Service
metadata:
  name: harness-dsh
  namespace: opute-harness
  labels:
    app.kubernetes.io/name: harness-dsh
    app.kubernetes.io/part-of: opute
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: harness-dsh
  ports:
    - name: http
      port: 3080
      targetPort: 3080
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: harness-dsh
  namespace: opute-harness
  labels:
    app.kubernetes.io/name: harness-dsh
    app.kubernetes.io/part-of: opute
    app.kubernetes.io/managed-by: opute-harness
spec:
  # One replica is sufficient for the public validation surface.  The model is
  # remote, so the pod has no node affinity or host-network dependency.
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: harness-dsh
  template:
    metadata:
      labels:
        app.kubernetes.io/name: harness-dsh
        app.kubernetes.io/part-of: opute
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      containers:
        - name: dsh
          image: localhost/opute-harness:k3s
          imagePullPolicy: Never
          env:
            - name: DSH_ROOT
              value: /workspace/deepseek-harness
            - name: OPUTE_HARNESS_PRESET_ROOT
              value: /workspace/opute-harness/packages/bundle-opute-web/presets
            - name: OPUTE_HARNESS_PORT
              value: "3080"
            - name: OPUTE_HARNESS_REQUIRE_MCP
              value: "1"
            - name: OPUTE_HARNESS_PRINT_URL
              value: "0"
            - name: OPUTE_HARNESS_PUBLIC_URL
              value: https://harness.opute.io/
            - name: OPUTE_MCP_ENDPOINT
              value: https://mcp.opute.io/mcp
            - name: OPUTE_MCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: opute-harness-mcp
                  key: token
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: opute-harness-openrouter
                  key: apiKey
            - name: HOME
              value: /tmp/dsh-home
          readinessProbe:
            tcpSocket:
              host: 127.0.0.1
              port: 3080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              host: 127.0.0.1
              port: 3080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 900Mi
          volumeMounts:
            - name: dsh-home
              mountPath: /tmp/dsh-home
        - name: cloudflared
          image: docker.io/cloudflare/cloudflared:2026.8.2
          imagePullPolicy: IfNotPresent
          # The official image is non-root; the Secret volume is mode 0440 so
          # the token is not readable by the DSH container in this pod.
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          args:
            - tunnel
            - --no-autoupdate
            - run
            - --token-file
            - /etc/cloudflared/token
          volumeMounts:
            - name: cloudflared-token
              mountPath: /etc/cloudflared
              readOnly: true
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: dsh-home
          emptyDir: {}
        - name: cloudflared-token
          secret:
            secretName: opute-harness-tunnel
            items:
              - key: token
                path: token
            defaultMode: 0440
