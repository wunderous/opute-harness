name: Opute Harness CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Opute Harness
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The Harness suite is deterministic and does not make model calls.
      # Keep OpenRouter credentials out of this job; any future provider test
      # must be a separate explicit lane pinned to the approved Granite model.
      - name: Run tests
        run: pnpm test

      - name: Verify tool lockdown
        run: pnpm verify:lockdown
